# GoReleaser configuration for dpb.
#
# It builds darwin/arm64 + darwin/amd64 (macOS only), and windows/arm64 +
# windows/amd64, publishes a GitHub release with checksums, and updates the
# Homebrew formula in mumudevx/homebrew-tap (darwin archives only).
#
# Three things are deliberately absent.
#
#   1. No codesign hook. Go's own linker ad-hoc signs every darwin/arm64 binary
#      host-independently — NeedCodeSign() is `ctxt.IsDarwin() && ctxt.IsARM64()`
#      with no host check — so Apple Silicon's kill-on-unsigned requirement is
#      already satisfied by `go build` alone. Verified on a plain `go build` of
#      this tree: `codesign -dv ./dpb` reports
#      `flags=0x20002(adhoc,linker-signed)` and `Signature=adhoc`. A `codesign
#      -s -` hook would change nothing and would create the false belief that
#      releases cannot be cut from a Linux runner.
#
#   2. No notarization and no Apple Developer account. Homebrew downloads with
#      curl, and curl sets no com.apple.quarantine attribute, so a formula-
#      installed CLI is never Gatekeeper-evaluated. Verified on this machine
#      (macOS 26.3.1, Homebrew 6.0.18): every brew-installed binary checked
#      carries only com.apple.provenance, and `xattr -p com.apple.quarantine`
#      answers "No such xattr".
#
#   3. No universal binary. darwin/arm64 and darwin/amd64 ship as two separate
#      archives, not one lipo-combined fat binary — that would need
#      goreleaser's `universal_binaries:` block, which this file does not
#      declare. Two single-arch archives is exactly what Formula/dpb.rb's
#      on_arm/on_intel split (and the tap-generated formula's
#      Hardware::CPU.arm? branch) already expect: brew fetches only the
#      archive matching the running machine, so nobody notices the binary
#      isn't fat.
#
# See docs/DOSSIER.md for the sources behind (1) and (2).

version: 2

project_name: dpb

before:
  hooks:
    # `go mod tidy` is deliberately NOT run here. CI already asserts that tidy
    # is a no-op, so running it during a release can only mutate the tree the
    # tag points at.
    - go mod download

builds:
  - id: dpb
    main: ./cmd/dpb
    binary: dpb
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - windows
    goarch:
      - arm64
      - amd64
    # darwin used to build arm64 only, with amd64 excluded by an `ignore` rule
    # here. That policy shipped a real crash on Intel: goreleaser's generated
    # tap formula has no way to say "unsupported on this architecture" for a
    # single-arch macOS build. It wraps the lone url in a bare
    # `if Hardware::CPU.arm?` with no else, so closing that branch on a
    # genuine Intel host doesn't decline the install — it fails with "formula
    # requires at least a URL" and a Ruby backtrace, verified with a local tap
    # and `brew tap-new`. No field under `brews:` (url_template, custom_block,
    # dependencies) reaches into that template to add a fallback. Building
    # darwin/amd64 gives the generated formula a real URL for both branches,
    # so an Intel Mac gets an install instead of a crash.
    flags:
      - -trimpath
    # These are the variables internal/buildinfo reads; `dpb version` falls
    # back to the VCS stamp when they are empty, so a mistyped path here shows
    # up as a version of "dev" rather than as a build failure. The Makefile
    # sets the same three.
    ldflags:
      - -s -w
      - -X github.com/mumudevx/dpb/internal/buildinfo.Version={{.Version}}
      - -X github.com/mumudevx/dpb/internal/buildinfo.Commit={{.FullCommit}}
      - -X github.com/mumudevx/dpb/internal/buildinfo.Date={{.CommitDate}}
    # Reproducible archives: without this the mtimes are the build time, so two
    # builds of one tag produce two different sha256 values and the formula
    # below cannot be checked by anyone but the person who cut the release.
    mod_timestamp: "{{ .CommitTimestamp }}"

# ONE archive block, with a per-platform format override.
#
# There were two, one declaring tar.gz and one zip, and both selected the same
# build id with no platform filter — `archives` has no goos field, so neither
# block was restricted to anything. Every platform was therefore archived
# TWICE: a snapshot produced six archives, including a darwin_arm64.zip and two
# windows .tar.gz files the README never mentions, plus three spurious lines in
# checksums.txt. A tester landing on the Releases page had to guess which of
# two archives for their platform was the intended one.
#
# format_overrides is the mechanism for "zip on Windows, tar.gz everywhere
# else", and it is keyed by goos, which is exactly the filter the second block
# was reaching for and could not express. No wintun.dll is bundled in either
# format; the README directs users to wintun.net.
archives:
  - id: dpb
    ids:
      - dpb
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# A formula, not a cask, even though GoReleaser deprecated `brews` in favour of
# `homebrew_casks` in v2.10.
#
# Homebrew Cask deliberately quarantines what it downloads — Homebrew 6.0.18's
# Library/Homebrew/cask/download.rb calls quarantine() on the downloaded path,
# which is what `--no-quarantine` exists to switch off. That would turn an
# install that Gatekeeper never evaluates into one that it does, for a binary
# with no Apple Developer identity behind it. Formulae and bottles are not
# quarantined, and the September 2026 cask delisting applies to homebrew-cask
# only. So this stays a formula until `brews` is actually removed; pin
# goreleaser to the v2 line (the release workflow does).
#
# Migrating was checked, not assumed: GoReleaser's own homebrew_casks docs
# (goreleaser.com/customization/homebrew_casks) put the cask manifest in
# Casks/, not Formula/ — a tap layout change — and their worked example
# removes the quarantine bit with a post-install `xattr` hook, which that same
# page calls out as bypassing macOS security. That hook is the quarantine
# problem above, not a fix for it. There is also no documented automatic
# upgrade from an existing formula install to a cask (Homebrew tracks the two
# as unrelated install types); short of hand-writing a tap_migrations.json, a
# user already on the formula would have to `brew uninstall dpb` and
# `brew install --cask dpb` themselves. None of that is worth trading away for
# silencing one deprecation warning on an unsigned, unnotarized binary.
brews:
  - name: dpb
    ids:
      - dpb
    repository:
      owner: mumudevx
      name: homebrew-tap
      # A cross-repository push needs a token with write access to the tap;
      # the workflow's default GITHUB_TOKEN is scoped to this repository only.
      #
      # This field takes `{{ .Env.NAME }}` and NOTHING else — goreleaser
      # validates the shape and rejects any conditional or surrounding text
      # with "expected {{ .Env.VAR_NAME }} only (no plain-text or other
      # interpolation)". The v0.1.0 release failed here after publishing its
      # archives, so the guard that used to live in this line has to live
      # somewhere else. It does: the workflow always defines the variable (as
      # the empty string when the secret is unset), so the lookup resolves, and
      # skip_upload below is what actually decides whether the push happens.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # Publishing to the tap is opt-in. The default is to skip it, so a local
    # `goreleaser release` — or a release run before the tap token exists —
    # still produces the archives, the checksums and dist/homebrew/Formula/dpb.rb
    # without trying to push into a repository it has no credentials for. The
    # release workflow sets this to false once it has seen the token.
    skip_upload: '{{ if index .Env "GORELEASER_SKIP_BREW" }}{{ .Env.GORELEASER_SKIP_BREW }}{{ else }}true{{ end }}'
    directory: Formula
    # The GitHub REPOSITORY slug, dpi-bypass-mac, not the Go module path
    # github.com/mumudevx/dpb — the module was never renamed to match the repo.
    # This field is copied verbatim into the GENERATED tap formula, so the
    # module path here meant `brew home dpb` opened a 404 and `brew audit`
    # flagged the formula. Not hypothetical: the same confusion already shipped
    # a `brew install` that 404'd. Formula/dpb.rb and everything under
    # packaging/ already use the slug; this line was the last one that did not.
    homepage: "https://github.com/mumudevx/dpi-bypass-mac"
    # Windows and macOS, matching packaging/scoop/dpb.json and the winget
    # locale manifest. It was macOS-only when this file was written.
    description: "DPI bypass for Windows and macOS: connects plain first, desyncs only on evidence"
    license: "MIT"
    commit_author:
      name: goreleaser
      email: noreply@github.com
    install: |
      bin.install "dpb"
    # Asserting on the version, not on the word "dpb": a formula still pointing
    # at the previous release's bottle would pass the weaker test. `dpb
    # strategy list` then proves the binary does more than print its own name,
    # and it touches no network, no system setting and no privileged
    # interface, so it is safe inside brew's sandbox.
    test: |
      assert_match version.to_s, shell_output("#{bin}/dpb version")
      assert_match "tlsfrag", shell_output("#{bin}/dpb strategy list")
    # No `service` block. Homebrew's would write a second LaunchAgent
    # (homebrew.mxcl.dpb) running the same binary as the one `dpb service
    # install` writes (com.mumudevx.dpb). Two supervisors racing to bind the
    # same port and to set and restore the same system proxy setting is a
    # failure this tool must not ship: whichever loses the port exits, and its
    # teardown restores the proxy the winner had just set.
    caveats: |
      dpb needs no root in proxy mode. Start it in the foreground with:

        dpb run

      To keep it running across logins, use dpb's own launchd installer rather
      than `brew services` — it writes one job, com.mumudevx.dpb, and knows
      where to put its logs:

        dpb service install
        dpb service status

      Measure your own line before trusting any profile:

        dpb tune

release:
  github:
    owner: mumudevx
    name: dpi-bypass-mac
  prerelease: auto
  footer: |
    ---

    Install:

        brew tap mumudevx/tap
        brew install dpb

    Verify what you downloaded against `checksums.txt` before running it.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
