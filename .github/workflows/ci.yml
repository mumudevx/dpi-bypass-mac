name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.4"

jobs:
  build:
    # darwin/arm64 is the only supported target, and most of the tree is
    # GOOS=darwin only, so CI runs on macOS rather than cross-compiling.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # so `git describe` can stamp a version

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          bad=$(gofmt -l cmd internal tools)
          if [ -n "$bad" ]; then
            echo "these files are not gofmt'd:"; echo "$bad"; exit 1
          fi

      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: dependency pins still resolve
        run: make deps

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # Cross-compile check: every package builds for windows except scdarwin.
      # Plan 4 landed test-side constraints for internal/testnet (KillFuzz) and
      # a real netwatch Source for windows, bringing all 25 packages into the
      # cross-compile gate. A package added later is INCLUDED automatically and
      # fails this step if it does not cross-compile, which is the point.
      #
      # The single exclusion:
      #
      #   internal/sysconf/scdarwin  is darwin-tagged by design and has no go
      #     files for any other GOOS. `go build ./...` silently skips such a
      #     package, but naming one explicitly is an error ("build constraints
      #     exclude all Go files"), so an explicit list has to drop it.
      - name: cross-compile check (windows)
        run: |
          pkgs=$(GOOS=windows go list ./... \
            | grep -v -E '/internal/sysconf/scdarwin$')
          GOOS=windows go build $pkgs

      - name: cross-compile vet (windows)
        run: |
          pkgs=$(GOOS=windows go list ./... \
            | grep -v -E '/internal/sysconf/scdarwin$')
          GOOS=windows go vet $pkgs

      - name: test (race)
        run: go test ./... -race

      # The build gates (no bare goroutine, no hostname dial) run inside the
      # normal test invocation above; they are named here so a failure is
      # obvious in the job list.
      - name: build gates
        run: go test ./internal/flow/ -run 'TestNo|TestGate' -v

      - name: cover-gate
        run: make cover-gate

  windows:
    # The first time any of the Windows code from plans 1-5 actually runs is
    # here. Everything before this job was "it compiles" or "it was read";
    # this is "it ran". Expect red: some of it has never executed before.
    #
    # This job does not mirror the macOS job in full. Three things are
    # decided below rather than silently matched or silently dropped:
    #
    #   internal/sysconf/scdarwin  every non-test file in this package is
    #     `//go:build darwin`, but its *_test.go files carry no build tag at
    #     all, so `go vet`/`go test` still see the package on any GOOS and one
    #     of its test files imports golang.org/x/net/route, which has no
    #     Windows files. `go build ./...` tolerates this (a package with zero
    #     buildable non-test files is dropped from the `...` wildcard
    #     silently), but vet and test do not — they fail on it with an error
    #     that is about x/net, not about this project's Windows code. The
    #     macOS job's own "cross-compile check/vet (windows)" steps already
    #     exclude this package by name for the identical reason; the same
    #     named exclusion is applied here, for build, vet, and test alike, so
    #     all three are exercised against the same package list.
    #
    #   make cover-gate  is not run here. Its statement-coverage floors
    #     (COVER_MIN=85, with the internal/front/tunfe=70 and
    #     internal/cliapp=83 exceptions in the Makefile) were calibrated by
    #     measuring coverage on darwin. Windows builds a different set of
    #     files under the same package names (scwindows instead of scdarwin,
    #     link_windows.go instead of link_darwin.go, and so on), so a
    #     percentage measured here would describe different code, not the
    #     same code measured twice. Comparing it against a darwin-calibrated
    #     floor would be a false pass or a false fail either way, not a
    #     measurement — gating Windows coverage needs floors measured on
    #     Windows, which nothing has done yet.
    #
    #   root-gated integration tests  are not excluded here, matching the
    #     macOS job, which excludes none either: there is no root-requiring
    #     integration suite anywhere in this tree. The tests that do touch
    #     privilege (e.g. TestLiveRIBReadableUnprivileged in internal/netstate,
    #     TestLiveRoutingSocketOpensUnprivileged in internal/netwatch) assert
    #     the *unprivileged* path and self-skip only if the runner happens to
    #     already be root/admin — GitHub-hosted runners are not, on macOS or
    #     Windows, so that self-skip is dormant in both places and needs no
    #     job-level handling.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          bad=$(gofmt -l cmd internal tools)
          if [ -n "$bad" ]; then
            echo "these files are not gofmt'd:"; echo "$bad"; exit 1
          fi

      - name: build
        run: |
          pkgs=$(go list ./... | grep -v -E '/internal/sysconf/scdarwin$')
          go build $pkgs

      - name: vet
        run: |
          pkgs=$(go list ./... | grep -v -E '/internal/sysconf/scdarwin$')
          go vet $pkgs

      - name: test
        run: |
          pkgs=$(go list ./... | grep -v -E '/internal/sysconf/scdarwin$')
          go test $pkgs

  fuzz:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: fuzz (60s per target)
        run: make fuzz FUZZTIME=60s
