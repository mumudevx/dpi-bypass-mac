name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.4"

jobs:
  build:
    # darwin/arm64 is the only supported target, and most of the tree is
    # GOOS=darwin only, so CI runs on macOS rather than cross-compiling.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # so `git describe` can stamp a version

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          bad=$(gofmt -l cmd internal tools)
          if [ -n "$bad" ]; then
            echo "these files are not gofmt'd:"; echo "$bad"; exit 1
          fi

      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: dependency pins still resolve
        run: make deps

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # Cross-compile check: 21 of 26 packages build for windows, up from 17.
      # Plan 3 landed internal/sysconf/scwindows and
      # internal/netstate/port_windows.go, so the list is no longer hand-written:
      # it is every package `go list` reports for windows, minus five named
      # exclusions. A package added later is therefore INCLUDED automatically and
      # fails this step if it does not cross-compile, which is the point.
      #
      # The five exclusions, and who owns each:
      #
      #   internal/netwatch  has no Source on windows. route_other.go is tagged
      #     `!darwin && !windows` ON PURPOSE — its own comment says a nil stub
      #     here would leave the watcher running on the sleep ticker alone while
      #     claiming to watch the network, and that leaving the build broken
      #     keeps it an open task rather than a silent degradation. The plan that
      #     owns netwatch ships a real source over the IP Helper notification
      #     API; until then this stays excluded rather than stubbed.
      #   internal/cliapp, cmd/dpb  import netwatch, so they fail for that one
      #     reason and no other. They come back the moment netwatch does.
      #   internal/testnet  KillFuzz is a SIGKILL harness built on syscall.Kill,
      #     which windows does not have. It is imported only from _test.go files,
      #     so nothing shipped depends on it. What a windows KillFuzz should do
      #     instead of SIGKILL is a real decision (TerminateProcess has no signal
      #     to report back, so "was it killed" stops being answerable the way it
      #     is here) and belongs to the plan that puts a binary on a windows
      #     machine, not to a build-tag applied to make this step green.
      #   internal/sysconf/scdarwin  is darwin-tagged by design. `go build ./...`
      #     silently skips a package with no files for the target, but naming one
      #     explicitly is an error ("build constraints exclude all Go files"), so
      #     an explicit list has to drop it.
      - name: cross-compile check (windows)
        run: |
          pkgs=$(GOOS=windows go list ./... \
            | grep -v -E '/(internal/(netwatch|cliapp|testnet|sysconf/scdarwin)|cmd/dpb)$')
          GOOS=windows go build $pkgs

      - name: test (race)
        run: go test ./... -race

      # The build gates (no bare goroutine, no hostname dial) run inside the
      # normal test invocation above; they are named here so a failure is
      # obvious in the job list.
      - name: build gates
        run: go test ./internal/flow/ -run 'TestNo|TestGate' -v

      - name: cover-gate
        run: make cover-gate

  fuzz:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: fuzz (60s per target)
        run: make fuzz FUZZTIME=60s
