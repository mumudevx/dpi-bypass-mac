Description: >-
  dpb gets past passive SNI inspection of the TLS ClientHello and DNS
  poisoning, the two censorship techniques actually measured on a Turk Telekom
  line. It runs a local proxy, reframes the first ClientHello record so the
  hostname is not complete inside the record a middlebox inspects, and
  resolves names over its own encrypted DNS chain. It connects with no desync
  first and escalates only when a connection is reset or closed before any
  server byte arrives, because every desync technique measured that bypassed
  the block also broke some other, unrelated site. It adds no encryption and
  no anonymity beyond what HTTPS already gives you.
